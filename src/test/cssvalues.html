<html>
  <header>
    <style>
      .box {
        background-color: lightblue;
        border: 5px solid darkblue;
        padding: 10px;
        margin: 1em 0;
      }

      .wrapper {
        font-size: 30px;
      }

      .px {
        width: 200px;
      }

      .vw {
        width: 50vw;
      }

      .em {
        width: 5em;
      }
    </style>
  </header>
  <body>
    <div class="wrapper">
      <div class="box px">I am 200px wide</div>
      <div class="box vw">I am 10vw wide</div>
      <div class="box em">I am 10em wide</div>
    </div>
  </body>
</html>
